name = "mendraw_sidecar"
version = "1.0.0"
gleam = ">= 1.17.0"
target = "erlang"
description = "HTTP sidecar for mendraw Marketplace browser automation"
licences = ["BlueOak-1.0.0"]

[dependencies]
gleam_stdlib = ">= 1.0.3 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
mist = ">= 6.0.3 and < 7.0.0"
simplifile = ">= 2.6.0 and < 3.0.0"
chrobot_extra = { path = "../../chrobot" }
shore = ">= 1.3.0 and < 2.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
envoy = ">= 1.2.0 and < 2.0.0"

[dev-dependencies]
gleescript = ">= 1.5.2 and < 2.0.0"
